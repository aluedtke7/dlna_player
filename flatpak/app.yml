# yaml-language-server: $schema=https://raw.githubusercontent.com/flatpak/flatpak-builder/main/data/flatpak-manifest.schema.json

---
id: de.luedtke.dlna_player
runtime: org.freedesktop.Platform
runtime-version: "23.08"
sdk: org.freedesktop.Sdk
command: dlna_player
separate-locales: false
finish-args:
  - --device=dri
  - --share=network
  - --socket=wayland
  - --socket=x11
  - --socket=pulseaudio
  - --socket=session-bus
  - --socket=system-bus
modules:
  - name: libass
    buildsystem: autotools
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.1/libass-0.17.1.tar.xz
        sha256: f0da0bbfba476c16ae3e1cfd862256d30915911f7abaa1b16ce62ee653192784
  - name: lua
    buildsystem: simple
    cleanup:
      - /bin
      - /include
      - /share/man
    build-commands:
      - make linux CFLAGS="-O2 -fPIC -DLUA_USE_LINUX" SYSLIBS="-Wl,-E -ldl -lreadline -lhistory -lncurses"
      - make install INSTALL_TOP=${FLATPAK_DEST}
      - |
        mkdir -p ${FLATPAK_DEST}/lib/pkgconfig
        cat > ${FLATPAK_DEST}/lib/pkgconfig/lua.pc <<EOF
        prefix=${FLATPAK_DEST}
        libdir=\${prefix}/lib
        includedir=\${prefix}/include

        Name: Lua
        Description: An Extensible Extension Language
        Version: 5.1.5
        Requires:
        Libs: -L\${libdir} -llua -lm
        Cflags: -I\${includedir}
        EOF
      - ln -s lua.pc ${FLATPAK_DEST}/lib/pkgconfig/lua5.1.pc
    sources:
      - type: archive
        url: https://www.lua.org/ftp/lua-5.1.5.tar.gz
        sha256: 2640fc56a795f29d28ef15e13c34a47e223960b0240e8cb0a82d9b0738695333
  - name: libmpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dlua=enabled
      - -Djavascript=disabled
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.36.0.tar.gz
        sha256: 29abc44f8ebee013bb2f9fe14d80b30db19b534c679056e4851ceadf5a5e8bf6
  - name: dlna_player
    buildsystem: simple
    only-arches:
      - x86_64
    build-commands:
      - "./build-flatpak.sh"
    sources:
      - type: file
        path: ./build-flatpak.sh
      - type: file
        path: ./DLNA_Player-Linux-Portable.tar.gz
      - type: file
        path: ../assets/linux-logo.png
        dest-filename: de.luedtke.dlna_player.png
      - type: file
        path: ./app.desktop
        dest-filename: de.luedtke.dlna_player.desktop
      - type: file
        path: ./app.metainfo.xml
        dest-filename: de.luedtke.dlna_player.metainfo.xml
      - type: file
        path: ./d-bus.service
        dest-filename: d-bus.service
